<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari Boda — Ride to Amboseli with someone who knows the road</title>
<meta name="description" content="Book a guided boda boda tour from Kimana toward Amboseli. Vetted riders, clear pricing, wildlife viewing on every package.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views/public.css">
<link rel="stylesheet" href="css/views/rider.css">
<link rel="stylesheet" href="css/views/admin.css">
</head>
<body>

<div id="app">
  <!-- Router renders the current view into here -->
</div>

<!-- ============================================
     SCRIPT LOAD ORDER MATTERS.
     No ES modules (file:// breaks import/export),
     so every file attaches to the global `SafariBoda`
     namespace object. Load order = dependency order:
     core/utils first, then components, then views,
     then the router + app bootstrap last.
     ============================================ -->

<!-- Supabase client library (CDN, exposes global `supabase` factory) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Core -->
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>

<!-- Utils -->
<script src="js/utils/format.js"></script>
<script src="js/utils/currency.js"></script>

<!-- Shared components -->
<script src="js/components/navbar.js"></script>

<!-- Public views -->
<script src="js/views/public/home.js"></script>
<script src="js/views/public/auth.js"></script>
<script src="js/views/public/request.js"></script>

<!-- Rider views -->
<script src="js/views/rider/register.js"></script>
<script src="js/views/rider/dashboard.js"></script>
<script src="js/views/rider/bookings.js"></script>

<!-- Admin views -->
<script src="js/views/admin/dashboard.js"></script>
<script src="js/views/admin/riders.js"></script>
<script src="js/views/admin/orders.js"></script>
<script src="js/views/admin/vendors.js"></script>

<!-- Router + bootstrap (must load last) -->
<script src="js/router.js"></script>
<script src="js/app.js"></script>

</body>
</html>
